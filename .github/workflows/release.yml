name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v2.4.1
        required: true
        default: v2.4.1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run check:public
      - run: bash -n ops/*.sh
      - run: python3 -m py_compile server/sync/*.py

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version='${{ inputs.version }}'
          else
            version="${GITHUB_REF_NAME}"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          package_version=$(node -p "require('./package.json').version")
          [[ "$version" == "v$package_version" ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Reject duplicate release
        shell: bash
        run: |
          if gh release view '${{ steps.version.outputs.value }}' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists' >&2
            exit 1
          fi
      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo 'Tag already exists' >&2
            exit 1
          fi
          gh api --method POST "/repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$version" -f "sha=$GITHUB_SHA" >/dev/null
      - name: Build public VPS packages
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.value }}'
          name="address-$version"
          mkdir -p "release/$name"
          for path in .dockerignore .env.example Dockerfile docker-compose.yml LICENSE README.md README.zh-CN.md README.zh-TW.md astro.config.mjs package.json package-lock.json tsconfig.json config docs image ops public scripts server src; do
            cp -a "$path" "release/$name/"
          done
          cp -a dist "release/$name/dist"
          find "release/$name" -type d -name __pycache__ -prune -exec rm -rf {} +
          tar -C release -czf "release/$name.tar.gz" "$name"
          (cd release && zip -qr "$name.zip" "$name")
          (cd release && sha256sum "$name.tar.gz" "$name.zip" > SHA256SUMS.txt)
      - name: Audit package contents
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.value }}'
          name="address-$version"
          test -s "release/$name.tar.gz"
          test -s "release/$name.zip"
          test -s release/SHA256SUMS.txt
          if find "release/$name" -type f \( -name '.env' -o -name '*.sqlite' -o -name '*.db' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then
            echo 'Private file shape found in release package' >&2
            exit 1
          fi
          (cd release && sha256sum -c SHA256SUMS.txt)
      - name: Write release notes
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          cat > release/RELEASE_NOTES.md <<'NOTES'
          ### Fresh installs
          - Fixed `service "migrate" didn't complete successfully: exit 1` on an empty database (#16, #17). The location catalog seed's `BEGIN`/`COMMIT` block now runs through one database transaction instead of being sent as single statements, which the database adapter rejects.
          - A catalog built from the upstream files current at install time counts as complete when the import loaded its whole seed. It no longer has to match the totals shipped with the release; the upstream postcode files had shrunk 13% since then. A catalog below 80% of the shipped totals still fails.

          ### IP-region generation
          - Cold IP-region picks went from 3.6-6 s to 0.2-1 s of server time, and China IP picks from 0.6-2 s to under 0.2 s. The coordinate index now covers the columns the box search reads (schema migration 37, built concurrently), the box starts at 0.5 km, and only the nearest rows are checked and read.
          - Repeated picks for one IP no longer cycle through the same few addresses. They draw at random among at least 32 nearby publishable addresses (16 communities in China), and the page redraws a pick shown in the last five draws.

          ### Dependencies
          - pypdf 6.21.4 (#15), which fixes 18 published advisories. The Vietnam postcode PDF parses identically.

          ### Upgrade notes
          - Migration 37 builds the covering coordinate index concurrently and swaps it in. Allow a few minutes on a large pool; the site stays available.
          - Installs stuck at `migrate`: `docker compose pull && docker compose up -d`.

          ### Verification
          - 1,727 JavaScript/TypeScript tests, Python tests, type checks, build and the public-release audit.
          - Live API validation in production.
          - A fresh README install on an empty ARM64 host: migrate completed, api, sync and credential-broker were healthy, first sign-in and token creation worked, and the first country synced (150,000 Canadian addresses).
          NOTES
      - name: Publish stable GitHub release
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          gh release create "$version" \
            "release/address-$version.tar.gz" \
            "release/address-$version.zip" \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$version" \
            --notes-file release/RELEASE_NOTES.md \
            --verify-tag
