name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v2.5.0
        required: true
        default: v2.5.0

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run check:public
      - run: bash -n ops/*.sh
      - run: python3 -m py_compile server/sync/*.py

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version='${{ inputs.version }}'
          else
            version="${GITHUB_REF_NAME}"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          package_version=$(node -p "require('./package.json').version")
          [[ "$version" == "v$package_version" ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Reject duplicate release
        shell: bash
        run: |
          if gh release view '${{ steps.version.outputs.value }}' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists' >&2
            exit 1
          fi
      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo 'Tag already exists' >&2
            exit 1
          fi
          gh api --method POST "/repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$version" -f "sha=$GITHUB_SHA" >/dev/null
      - name: Build public VPS packages
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.value }}'
          name="address-$version"
          mkdir -p "release/$name"
          for path in .dockerignore .env.example Dockerfile docker-compose.yml LICENSE README.md README.zh-CN.md README.zh-TW.md astro.config.mjs package.json package-lock.json tsconfig.json config docs image ops public scripts server src; do
            cp -a "$path" "release/$name/"
          done
          cp -a dist "release/$name/dist"
          find "release/$name" -type d -name __pycache__ -prune -exec rm -rf {} +
          tar -C release -czf "release/$name.tar.gz" "$name"
          (cd release && zip -qr "$name.zip" "$name")
          (cd release && sha256sum "$name.tar.gz" "$name.zip" > SHA256SUMS.txt)
      - name: Audit package contents
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.value }}'
          name="address-$version"
          test -s "release/$name.tar.gz"
          test -s "release/$name.zip"
          test -s release/SHA256SUMS.txt
          if find "release/$name" -type f \( -name '.env' -o -name '*.sqlite' -o -name '*.db' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then
            echo 'Private file shape found in release package' >&2
            exit 1
          fi
          (cd release && sha256sum -c SHA256SUMS.txt)
      - name: Write release notes
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          cat > release/RELEASE_NOTES.md <<'NOTES'
          ### Speed
          - Nationwide address generation no longer slows down in countries where many rows were retired; a pick reads a few index entries instead of falling back to a wide scan.
          - Pages load their scripts in one parallel batch and start their first requests before the stylesheet arrives. The pinyin dictionary and each admin view load only when used, which cuts the home page's largest script from 306 KB to 19 KB.
          - `/`, `/admin/` and `/access/` answer with a redirect to the visitor's language instead of a page that redirects in script.
          - The coverage listing behind the dashboard and the public monitor is served from a cached value while it refreshes.

          ### Map
          - Selecting a country on the coverage map and zooming in shows county-level boundaries with their names on hover, for the 24 countries where Overture Maps publishes them.

          ### Sync
          - A source that imported only its per-run growth step now continues on the same source version until it reaches its limit. Before, it waited for the next upstream release.
          - Australia imports per state, and the England and Northern Ireland limits are higher.
          - Sync startup no longer runs a whole-pool scan that timed out on large databases.
          - The Japan ABR import source is removed: it never completed, and no open replacement carries postcodes. Published Japanese addresses stay available.

          ### Storage
          - Completed translation bookkeeping rows and an index that duplicated the evidence primary key are removed at sync startup, freeing several gigabytes on large installs.

          ### Fixes
          - Chinese communities whose names contain a character the pinyin dictionary cannot romanize are no longer served with that character left in the English address.

          ### Verification
          - JavaScript/TypeScript tests, Python tests, type checks, build and the public-release audit.
          - Live API and browser validation in production, a 500-sample contract audit per country, and full-pool quality audits for the countries whose data changed.
          NOTES
      - name: Publish stable GitHub release
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          gh release create "$version" \
            "release/address-$version.tar.gz" \
            "release/address-$version.zip" \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$version" \
            --notes-file release/RELEASE_NOTES.md \
            --verify-tag
